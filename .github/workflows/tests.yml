name: tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 pytest
        run: pip install pytest

      - name: 运行回归测试（18 条用例，修复版）
        run: pytest test_score_fixed.py -v
